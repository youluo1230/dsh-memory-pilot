# MemoryPilot default bundle patch — ships with the package and is applied
# automatically when this plugin is listed in dsh.profile.bundles.
#
# It registers the plugin with SAFE, GENERIC defaults:
#   - enabled: false        (turn it on in the settings UI or in your own
#                            cordis.patch.yml after configuring a decision
#                            model and at least one memory backend)
#   - no identities, no gateway URLs, no model names, no backend bindings
#
# Nothing here is machine-specific. Your local values (decision endpoint,
# model, backends) go through the MemoryPilot settings panel or your own
# profile patch layer, NOT this file. See examples/cordis-patch-minimal.yml
# for a ready-to-extend binding template.
- insert:
    - id: dsh-memory-pilot
      name: dsh-memory-pilot
      config:
        enabled: false
        actorId: ''
        projectId: ''
        workspaceId: ''
        workspacePath: ''
        decisionProtocol: systemone
        decisionBaseUrl: ''
        decisionModel: ''
        decisionKeyEnv: MEMORY_DECISION_API_KEY
        budgetMs: 9000
        captureBudgetMs: 60000
        backends: []
